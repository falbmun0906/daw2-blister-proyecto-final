services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - blister-internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (!rs.status().ok) quit(1); } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://localhost:8080
      MONGODB_URI: mongodb://mongo:27017/blister?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:8080
      EMAIL_ASSET_ORIGIN: https://blister-app.onrender.com
      MCP_SERVER_ENABLED: "true"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('node:http').get('http://127.0.0.1:3000/api/v1/ready', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - blister-internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_MCP_URL: http://localhost:8080
    restart: unless-stopped
    env_file:
    - ./frontend/.env   # ← el de frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blister-internal

volumes:
  mongo-data:

networks:
  blister-internal:
    driver: bridge
